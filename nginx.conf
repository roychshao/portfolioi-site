# Served by nginxinc/nginx-unprivileged (runs as UID 101, listens on 8080).
# Copied to /etc/nginx/conf.d/default.conf inside the image.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # gzip text formats only — woff2/webp are already compressed and are
    # deliberately NOT added to gzip_types.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (repeated per location: nginx does not inherit
    # add_header into blocks that declare their own).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed Astro assets: content-addressed filenames, safe to cache forever.
    # `^~` keeps this ahead of the extension regex below.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Static assets outside /_astro/ (e.g. favicon, public images): 7 days.
    location ~* \.(webp|png|jpg|js|css|woff2)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # HTML pages: always revalidate so deploys are instantly visible.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
